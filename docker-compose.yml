services:
  next-ai-draw-io:
    build: .
    image: next-ai-draw-io:v1.0
    container_name: next-ai-draw-io
    ports:
      - "3000:3000"
    environment:
      - AI_PROVIDER=deepseek
      - AI_MODEL=deepseek-v4-flash
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
    volumes:
      - ./data:/app/data
    restart: always